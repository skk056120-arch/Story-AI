<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryAI - Cinematic Horror Narrator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0f; color: #f1f1f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
        .phone-frame { width: 100%; max-width: 400px; height: 820px; background: #121218; border: 4px solid #2a1b2e; border-radius: 40px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .header { background: linear-gradient(135deg, #1f1124, #121218); padding: 15px 20px; border-bottom: 1px solid #2a1b2e; display: flex; align-items: center; justify-content: space-between; }
        .app-title h1 { font-size: 18px; color: #ff334b; letter-spacing: 1px; }
        .app-title p { font-size: 10px; color: #8c8291; text-transform: uppercase; }
        .content { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #181822; border: 1px solid #262636; border-radius: 12px; padding: 15px; }
        .card h3 { font-size: 14px; margin-bottom: 8px; color: #e1dced; }
        textarea { width: 100%; height: 140px; background: #111116; border: 1px solid #332238; border-radius: 8px; color: #fff; padding: 10px; font-size: 13px; resize: none; outline: none; }
        .btn-primary { width: 100%; background: #e60023; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; margin-top: 10px; transition: 0.2s; }
        .btn-primary:active { background: #b3001b; }
        .nav-bar { height: 60px; background: #121218; border-top: 1px solid #221c24; display: flex; justify-content: space-around; align-items: center; }
        .nav-item { font-size: 11px; color: #7a7080; text-align: center; cursor: pointer; }
        .nav-item.active { color: #ff334b; }
        .status-box { font-size: 12px; color: #a39bb0; background: #1f1b24; padding: 10px; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Header -->
        <div class="header">
            <div class="app-title">
                <h1>STORYAI</h1>
                <p>Cinematic Narrator</p>
            </div>
            <div style="font-size: 11px; background: #2a1622; color: #ff4d6d; padding: 4px 8px; border-radius: 10px;">💀 Male SFX</div>
        </div>

        <!-- Main Content Area -->
        <div class="content" id="main-content">
            <!-- Story Tab Content -->
            <div class="card">
                <h3>YOUR HORROR STORY</h3>
                <textarea placeholder="Yahan apni horror kahani likhein (jaise: raat ko aandhi chal rahi thi, darwaza khula...)"></textarea>
                <div style="font-size: 11px; color: #7a7080; margin-top: 5px;">Auto-chunks long stories & triggers rain, thunder, wind, barks, footsteps.</div>
            </div>

            <div class="card">
                <h3>NARRATOR VOICE (MALE ONLY)</h3>
                <select style="width: 100%; padding: 10px; background: #111116; color: white; border: 1px solid #332238; border-radius: 8px;">
                    <option>Deep Suspense Male Narrator</option>
                    <option>Whispering Horror Male Voice</option>
                    <option>Thriller Heavy Male Voice</option>
                </select>
            </div>

            <button class="btn-primary" onclick="generateAudio()">⚡ Generate Cinematic Audio</button>

            <div class="status-box" id="statusBox" style="display:none;">
                🔄 Processing audio & syncing cloud horror SFX (Wind, Thunder, Crying, Footsteps)...
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('story')">📄<br>Story</div>
            <div class="nav-item" onclick="switchTab('voice')">🎙️<br>Voice</div>
            <div class="nav-item" onclick="switchTab('sfx')">⚡<br>SFX Engine</div>
            <div class="nav-item" onclick="switchTab('settings')">⚙️<br>Settings</div>
        </div>
    </div>

    <script>
        function generateAudio() {
            const status = document.getElementById('statusBox');
            status.style.display = 'block';
            setTimeout(() => {
                status.innerHTML = '✅ Audio rendered successfully with Male Voice & Auto-SFX!';
            }, 3000);
        }

        function switchTab(tabName) {
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
                                                                                                                                  </html>
